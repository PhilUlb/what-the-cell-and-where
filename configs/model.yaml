defaults:
  - _self_

# Model architecture
model:
  name: unet
  encoder: vgg16  # Options: vgg16, mobilenet_v2, scratch
  pretrained: true
  in_channels: 1
  out_channels: 1
  features: [32, 64, 128, 256, 512]
  activation: relu
  dropout: 0.3
  batch_norm: true

# Encoder configurations
encoder:
  vgg16:
    pretrained: true
    freeze_encoder: false
    freeze_batch_norm: false
  mobilenet_v2:
    pretrained: true
    freeze_encoder: false
    freeze_batch_norm: false
  scratch:
    features: [32, 64, 128, 256, 512]

# Loss function configuration
loss:
  name: bce_dice  # Options: bce, dice, bce_dice
  bce_weight: 0.5
  dice_weight: 0.5
  smooth: 1e-6
  reduction: mean

# Optimizer configuration
optimizer:
  name: adamw  # Options: adam, adamw, sgd
  lr: 0.001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1e-8

# Learning rate scheduler
scheduler:
  name: cosine  # Options: cosine, step, plateau, onecycle
  warmup_epochs: 5
  max_lr: 0.001
  min_lr: 1e-6
  step_size: 30
  gamma: 0.1
  patience: 10

# Training configuration
training:
  mixed_precision: true
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  deterministic: true
  benchmark: true 